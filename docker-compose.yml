# GUPT — static file server for the built SPA. No backend, no volumes: keys,
# cache and encrypted data all live in the browser.
#
#   docker compose up -d
#   docker compose pull && docker compose up -d
#
# Requires a secure context (HTTPS or localhost) — browsers withhold
# crypto.subtle and service workers on plain http, which breaks TOTP, key
# import, and PWA install. Put a reverse proxy in front, or use localhost.

services:
  gupt:
    image: ghcr.io/besoeasy/gupt:latest
    restart: unless-stopped
    pull_policy: always
    ports:
      # GUPT_BIND=127.0.0.1 to publish only on loopback behind your own proxy.
      - "${GUPT_BIND:-0.0.0.0}:${GUPT_PORT:-8000}:8000"
    read_only: true
    tmpfs: [/data, /config, /tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"