name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.stamp.outputs.release_tag }}
      flatpak_bundle: ${{ steps.stamp.outputs.flatpak_bundle }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate calendar version
        run: |
          version="$(jq -r .version package.json)"
          lock_version="$(jq -r .version package-lock.json)"

          # YYYY.MMDD.N — unpadded month (a leading zero is invalid semver),
          # padded day, and a per-day release counter that starts at 1.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]{4}\.(1[0-2]|[1-9])[0-9]{2}\.[1-9][0-9]*$'; then
            echo "::error::package.json version '$version' is not YYYY.MMDD.N (e.g. 2026.1120.1)."
            exit 1
          fi

          if [ "$version" != "$lock_version" ]; then
            echo "::error::package-lock.json version '$lock_version' does not match package.json '$version'."
            exit 1
          fi

          # A reused tag silently overwrites the previous release's assets.
          if git ls-remote --tags --exit-code origin "refs/tags/$version" > /dev/null; then
            echo "::error::tag '$version' already exists — increment N for another release today."
            exit 1
          fi
      - name: Read version from package.json
        id: stamp
        run: |
          release_tag="$(jq -r .version package.json)"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "flatpak_bundle=gupt-$release_tag-linux.flatpak" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Live-relay tests are opt-in (GUPT_LIVE=1) so CI stays deterministic.
      - name: Test
        run: npm test

  build-flatpak:
    needs: [prepare-release, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache flatpak data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-${{ runner.os }}-gnome50-node24
      - name: Install flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build:flatpak
      - run: flatpak-builder --force-clean --repo=repo build-dir flatpak/com.besoeasy.gupt.dev.yaml
      - run: flatpak build-bundle repo "${{ needs.prepare-release.outputs.flatpak_bundle }}" com.besoeasy.gupt --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.prepare-release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare-release.outputs.release_tag }}
          files: ${{ needs.prepare-release.outputs.flatpak_bundle }}
          overwrite_files: true
          generate_release_notes: true

  build-docker:
    needs: [prepare-release, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare-release.outputs.release_tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-deploy:
    needs: [build-flatpak, build-docker]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
