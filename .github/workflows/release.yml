name: Release

on:
  workflow_dispatch:

# Least privilege: every job declares exactly what it needs.
permissions: {}

# One release at a time — a second dispatch queues instead of racing the
# first for the same tag, bundle name and Pages deploy. The Pages
# serialisation lives on the deploy-pages job (group: pages), as GitHub
# documents, so this group only guards releases against each other.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Single source of truth for the release: validates once, builds the web
  # dist once, and hands both down. Previously prepare/test/pages each ran
  # `npm ci` + a build; now downstream jobs download `web-dist` instead.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.stamp.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate calendar version
        run: |
          # The version is typed by hand in package.json; the tag guard below
          # is what stops a reused one from overwriting a published release.
          npm run --silent format:check

          version="$(jq -r .version package.json)"
          # A reused tag silently overwrites the previous release's assets.
          if git ls-remote --tags --exit-code origin "refs/tags/$version" > /dev/null; then
            echo "::error::tag '$version' already exists — gupt releases once per day, so today's release is already published."
            exit 1
          fi

          echo "release_tag=$version" >> "$GITHUB_OUTPUT"
        id: stamp

      - name: Test
        # Live-relay tests are opt-in (GUPT_LIVE=1) so CI stays deterministic.
        run: npm test

      - name: Build website
        run: npm run build

      - name: Upload web dist for Pages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

      - name: Summary
        env:
          RELEASE_TAG: ${{ steps.stamp.outputs.release_tag }}
        run: |
          {
            echo "### Release $RELEASE_TAG"
            echo "- Web dist built once here; Pages reuses it (no rebuild)."
            echo "- Docker builds inside its own multi-arch builder."
          } >> "$GITHUB_STEP_SUMMARY"

  build-docker:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.release_tag }}
            type=raw,value=latest
            type=sha

      - name: Build and push
        id: bake
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Summary
        env:
          DIGEST: ${{ steps.bake.outputs.digest }}
        run: |
          echo "digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"

  # Pages deploys the dist built in `validate` — it no longer waits for the
  # slow docker job, and it does no second `npm ci` + build.
  deploy-pages:
    needs: validate
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # The only job that writes a release. Creating it here — after docker
  # and pages both succeed — means a failed build can never leave a
  # half-published tag behind.
  publish:
    needs: [validate, build-docker, deploy-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
