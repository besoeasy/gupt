name: Deploy to IPFS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Zip dist
        run: cd dist && zip -r ../build.zip .

      - name: Upload to IPFS
        id: upload
        run: |
          response=$(curl -s -X POST -F "file=@build.zip" https://originless.gupt.app/uploadzip)
          echo "$response"
          cid=$(echo "$response" | jq -r '.cid // empty')
          if [ -z "$cid" ]; then
            echo "::error::Failed to extract CID from response"
            exit 1
          fi
          echo "ipfs_url=https://dweb.link/ipfs/$cid" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Deployed to ${{ steps.upload.outputs.ipfs_url }}" >> "$GITHUB_STEP_SUMMARY"
