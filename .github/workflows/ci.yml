name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check format and release version
        run: npm run --silent release:check

      - name: Test
        # Live-relay tests are opt-in (GUPT_LIVE=1) so CI stays deterministic.
        run: npm test

      - name: Build website
        run: npm run build
