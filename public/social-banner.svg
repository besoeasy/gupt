<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GUPT - End-to-End Encrypted Messenger</title>
  <desc id="desc">GUPT is a modern, local-first end-to-end encrypted private messenger featuring direct messaging, secure media vault, and real-time E2EE audio/video calls.</desc>
  
  <defs>
    <!-- Grid Pattern for Canvas Background -->
    <pattern id="dot-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#20293a" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#090a0f" />
  <rect width="1200" height="630" fill="url(#dot-grid)" opacity="0.75" />

  <!-- Background Geometric Accent Framing (Solid Shapes & Strokes) -->
  <rect x="40" y="40" width="1120" height="550" rx="28" fill="none" stroke="#1d2636" stroke-width="2" />
  <circle cx="1060" cy="80" r="140" fill="#0d131f" stroke="#161f30" stroke-width="2" />
  <circle cx="100" cy="540" r="180" fill="#0b101a" stroke="#151d2d" stroke-width="2" />

  <!-- LEFT COLUMN: Brand Identity & Feature Highlights -->

  <!-- E2EE Pill Badge -->
  <g transform="translate(84, 82)">
    <rect width="266" height="36" rx="18" fill="#132034" stroke="#25416a" stroke-width="1.5" />
    <circle cx="22" cy="18" r="6" fill="#10b981" />
    <path d="M22 13.5 v3 M20.5 16.5 h3 v3.5 h-3 z" fill="none" stroke="#090a0f" stroke-width="1" />
    <text x="38" y="23" fill="#60a5fa" font-size="13" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.2">END-TO-END ENCRYPTED</text>
  </g>

  <!-- Logo & Title -->
  <g transform="translate(84, 150)">
    <!-- GUPT App Mark (Solid Icon Badge) -->
    <rect width="76" height="76" rx="22" fill="#2563eb" />
    <path d="M38 16c-12.1 0-22 9.9-22 22s9.9 22 22 22c6.5 0 12.3-2.8 16.4-7.2V43.6H38v-9h19.1v20.3C52.7 61.1 42.6 65.3 31.5 65.3 16.3 65.3 4 53 4 37.8S16.3 10.3 31.5 10.3c8 0 15.1 3.4 20.3 8.6l-6.1 5.9C41.6 20.7 36.6 16 38 16Z" fill="#ffffff" transform="translate(0, -4) scale(1)" />
    <circle cx="52.7" cy="18.5" r="3.8" fill="#38bdf8" />

    <!-- App Name -->
    <text x="96" y="58" fill="#ffffff" font-size="64" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-1.5">GUPT</text>
  </g>

  <!-- Headline -->
  <text x="84" y="278" fill="#f8fafc" font-size="30" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.5">
    Private, local-first messenger.
  </text>

  <!-- Key Value Points -->
  <g transform="translate(84, 320)">
    <!-- Bullet 1 -->
    <g transform="translate(0, 0)">
      <rect width="28" height="28" rx="8" fill="#131c2e" stroke="#233554" stroke-width="1.5" />
      <path d="M9 14l3.5 3.5L19 10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="42" y="19" fill="#cbd5e1" font-size="17" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Zero-knowledge identity &amp; offline storage</text>
    </g>

    <!-- Bullet 2 -->
    <g transform="translate(0, 44)">
      <rect width="28" height="28" rx="8" fill="#131c2e" stroke="#233554" stroke-width="1.5" />
      <path d="M9 14l3.5 3.5L19 10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="42" y="19" fill="#cbd5e1" font-size="17" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Direct E2EE chat &amp; encrypted media vault</text>
    </g>

    <!-- Bullet 3 -->
    <g transform="translate(0, 88)">
      <rect width="28" height="28" rx="8" fill="#131c2e" stroke="#233554" stroke-width="1.5" />
      <path d="M9 14l3.5 3.5L19 10" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="42" y="19" fill="#cbd5e1" font-size="17" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Secure E2EE voice &amp; video calling</text>
    </g>
  </g>

  <!-- Bottom Link Tag -->
  <g transform="translate(84, 492)">
    <rect width="136" height="38" rx="10" fill="#111827" stroke="#1f2937" stroke-width="1.5" />
    <text x="68" y="24" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="600" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.5">GUPT.APP</text>
  </g>


  <!-- RIGHT COLUMN: Modern App Interface Mockup Card -->

  <!-- Outer App Window Frame -->
  <g transform="translate(630, 75)">
    <!-- Shadow backdrop (Solid flat shape offset) -->
    <rect x="12" y="12" width="480" height="480" rx="24" fill="#04060a" />
    
    <!-- Main Card Body -->
    <rect width="480" height="480" rx="24" fill="#111622" stroke="#232d42" stroke-width="2" />

    <!-- Card Header / Titlebar -->
    <rect width="480" height="68" rx="24" fill="#161d2d" />
    <!-- Bottom line to clip top radius smoothly -->
    <rect y="44" width="480" height="24" fill="#161d2d" />
    <line x1="0" y1="68" x2="480" y2="68" stroke="#232d42" stroke-width="1.5" />

    <!-- Window Dots -->
    <circle cx="28" cy="34" r="5.5" fill="#ef4444" />
    <circle cx="46" cy="34" r="5.5" fill="#f59e0b" />
    <circle cx="64" cy="34" r="5.5" fill="#10b981" />

    <!-- Contact Info Header -->
    <g transform="translate(100, 16)">
      <!-- Avatar Circle -->
      <circle cx="18" cy="18" r="18" fill="#2563eb" />
      <text x="18" y="24" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" font-family="system-ui, sans-serif">A</text>
      <!-- Online Badge -->
      <circle cx="30" cy="30" r="5" fill="#10b981" stroke="#161d2d" stroke-width="2" />

      <!-- Contact Name -->
      <text x="46" y="17" fill="#f8fafc" font-size="15" font-weight="700" font-family="system-ui, sans-serif">Alice</text>
      <!-- Verified Security Pill -->
      <text x="46" y="32" fill="#34d399" font-size="11" font-weight="600" font-family="system-ui, sans-serif">● Trusted Contact (E2EE)</text>
    </g>

    <!-- Header Right Icons -->
    <g transform="translate(380, 22)">
      <!-- Phone Call Icon Box -->
      <rect width="32" height="32" rx="8" fill="#1e273a" stroke="#2c3954" stroke-width="1" />
      <path d="M12 11c1 2 2.5 3.5 4.5 4.5l1.5-1.5c.3-.3.8-.4 1.2-.2 1.3.5 2.7.8 4.2.8.4 0 .7.3.7.7v3.2c0 .4-.3.7-.7.7C13.6 26.2 5.8 18.4 5.8 8.7c0-.4.3-.7.7-.7h3.2c.4 0 .7.3.7.7 0 1.5.3 2.9.8 4.2.1.4 0 .9-.2 1.2L12 11z" fill="#60a5fa" transform="translate(-1, -1) scale(0.85)" />
      
      <!-- Video Icon Box -->
      <g transform="translate(40, 0)">
        <rect width="32" height="32" rx="8" fill="#1e273a" stroke="#2c3954" stroke-width="1" />
        <path d="M9 11h10v10H9z M19 14l5-3v10l-5-3" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2, -2) scale(0.8)" />
      </g>
    </g>


    <!-- CHAT AREA MESSAGES -->

    <!-- Incoming Message 1 -->
    <g transform="translate(24, 94)">
      <rect width="310" height="54" rx="16" fill="#1a2234" stroke="#27344d" stroke-width="1" />
      <text x="16" y="24" fill="#e2e8f0" font-size="14" font-weight="500" font-family="system-ui, sans-serif">Hey! Is our chat fully end-to-end</text>
      <text x="16" y="42" fill="#e2e8f0" font-size="14" font-weight="500" font-family="system-ui, sans-serif">encrypted?</text>
      <text x="264" y="42" fill="#64748b" font-size="10" font-weight="500" font-family="system-ui, sans-serif">10:42</text>
    </g>

    <!-- Outgoing Message 1 -->
    <g transform="translate(130, 164)">
      <rect width="326" height="54" rx="16" fill="#2563eb" />
      <text x="16" y="24" fill="#ffffff" font-size="14" font-weight="600" font-family="system-ui, sans-serif">100% 🔒 Private keys stay on your</text>
      <text x="16" y="42" fill="#ffffff" font-size="14" font-weight="600" font-family="system-ui, sans-serif">device. No server can read this!</text>
      <text x="274" y="42" fill="#bfdbfe" font-size="10" font-weight="600" font-family="system-ui, sans-serif">10:43 ✓✓</text>
    </g>

    <!-- Call Active / Security Banner inside Chat -->
    <g transform="translate(24, 236)">
      <rect width="432" height="64" rx="16" fill="#0e1a2b" stroke="#1d3557" stroke-width="1.5" />
      
      <!-- Shield Icon Circle -->
      <circle cx="36" cy="32" r="18" fill="#10b981" />
      <path d="M36 21l8 4v6c0 5.5-3.8 10.7-8 12-4.2-1.3-8-6.5-8-12v-6l8-4z" fill="#064e3b" />
      <path d="M33 32l2.5 2.5L40 29" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

      <text x="68" y="28" fill="#f8fafc" font-size="14" font-weight="700" font-family="system-ui, sans-serif">Encrypted Voice &amp; Video Call Ready</text>
      <text x="68" y="46" fill="#34d399" font-size="12" font-weight="500" font-family="system-ui, sans-serif">Unlocked for trusted contact • Peer-to-Peer E2EE</text>
    </g>

    <!-- Outgoing Message 2 (Media file badge) -->
    <g transform="translate(180, 316)">
      <rect width="276" height="52" rx="16" fill="#2563eb" />
      <!-- Attachment File Icon -->
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#1d4ed8" />
      <path d="M22 20h8M22 24h5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="48" y="28" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">vault_document.enc</text>
      <text x="48" y="42" fill="#93c5fd" font-size="11" font-weight="500" font-family="system-ui, sans-serif">2.4 MB • Encrypted Vault</text>
    </g>

    <!-- Chat Input Area -->
    <g transform="translate(24, 396)">
      <rect width="432" height="56" rx="28" fill="#090d16" stroke="#232d42" stroke-width="1.5" />
      
      <!-- Lock Icon left inside input -->
      <circle cx="30" cy="28" r="12" fill="#162032" />
      <path d="M27 26v-2a3 3 0 0 1 6 0v2 m-5 0h10v7H25z" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" />

      <text x="54" y="33" fill="#64748b" font-size="14" font-weight="400" font-family="system-ui, sans-serif">Send an encrypted message...</text>

      <!-- Send Button Circle -->
      <circle cx="404" cy="28" r="18" fill="#2563eb" />
      <path d="M398 28h12M404 22l6 6-6 6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

  </g>
</svg>