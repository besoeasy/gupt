<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GUPT - End-to-End Encrypted Messenger</title>
  <desc id="desc">GUPT is a minimal, modern, local-first end-to-end encrypted private messenger.</desc>
  
  <defs>
    <!-- Minimalist Technical Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161c28" stroke-width="1" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#222c3e" />
    </pattern>
  </defs>

  <!-- Canvas Deep Obsidian Background -->
  <rect width="1200" height="630" fill="#07080c" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Architectural Framing & Corner Crosshairs -->
  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#18202e" stroke-width="1.5" rx="16" />
  
  <!-- Technical Corner Marks (Startup/Engineering aesthetic) -->
  <path d="M 40 48 H 56 M 48 40 V 56" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" />
  <path d="M 1144 48 H 1160 M 1152 40 V 56" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" />
  <path d="M 40 582 H 56 M 48 574 V 590" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" />
  <path d="M 1144 582 H 1160 M 1152 574 V 590" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" />

  <!-- LEFT SECTION: Brand & Minimal Copy -->

  <!-- Top Category Tag -->
  <g transform="translate(96, 96)">
    <rect width="216" height="32" rx="8" fill="#0e1524" stroke="#1d2b45" stroke-width="1" />
    <circle cx="18" cy="16" r="4" fill="#10b981" />
    <text x="32" y="21" fill="#60a5fa" font-size="12" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1.5">PRIVATE MESSENGER</text>
  </g>

  <!-- Brand Title & Logo (Linear-style lock & G mark) -->
  <g transform="translate(96, 160)">
    <!-- Logo Badge -->
    <rect width="68" height="68" rx="20" fill="#2563eb" />
    <path d="M34 14c-10.8 0-19.6 8.8-19.6 19.6s8.8 19.6 19.6 19.6c5.8 0 11-2.5 14.6-6.4v-8.8H34v-8h17.1v18.1C47.1 54.5 38.1 58.2 28.2 58.2 14.6 58.2 3.6 47.2 3.6 33.6S14.6 9 28.2 9c7.1 0 13.5 3 18.1 7.7l-5.4 5.3C37.2 18.2 32.7 14 34 14Z" fill="#ffffff" transform="translate(0, -3.5)" />
    <circle cx="47" cy="16" r="3.5" fill="#38bdf8" />

    <!-- Wordmark -->
    <text x="88" y="52" fill="#ffffff" font-size="64" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-2">GUPT</text>
  </g>

  <!-- Minimal Headline -->
  <text x="96" y="282" fill="#f8fafc" font-size="34" font-weight="700" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.8">
    End-to-End Encrypted.
  </text>
  <text x="96" y="324" fill="#94a3b8" font-size="28" font-weight="500" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.4">
    Local-first, private by default.
  </text>

  <!-- Minimal Feature Pills Bar -->
  <g transform="translate(96, 388)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="34" rx="17" fill="#121929" stroke="#202c44" stroke-width="1" />
    <circle cx="18" cy="17" r="3.5" fill="#38bdf8" />
    <text x="30" y="22" fill="#cbd5e1" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Zero-Knowledge</text>

    <!-- Pill 2 -->
    <rect x="150" y="0" width="128" height="34" rx="17" fill="#121929" stroke="#202c44" stroke-width="1" />
    <circle cx="168" cy="17" r="3.5" fill="#10b981" />
    <text x="180" y="22" fill="#cbd5e1" font-size="13" font-weight="600" font-family="system-ui, sans-serif">E2EE Calls</text>

    <!-- Pill 3 -->
    <rect x="290" y="0" width="144" height="34" rx="17" fill="#121929" stroke="#202c44" stroke-width="1" />
    <circle cx="308" cy="17" r="3.5" fill="#a855f7" />
    <text x="320" y="22" fill="#cbd5e1" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Local Vault</text>
  </g>

  <!-- Bottom Brand Domain Stamp -->
  <g transform="translate(96, 496)">
    <text x="0" y="20" fill="#475569" font-size="14" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="2.5">GUPT.APP</text>
    <line x1="110" y1="15" x2="320" y2="15" stroke="#1e293b" stroke-width="1" />
  </g>


  <!-- RIGHT SECTION: Ultra-Minimal Startup Product Frame -->
  
  <g transform="translate(680, 96)">
    <!-- Base Card Container -->
    <rect width="420" height="438" rx="20" fill="#0d111a" stroke="#1d2638" stroke-width="1.5" />

    <!-- Top Window / Bar Header -->
    <rect width="420" height="54" rx="20" fill="#131926" />
    <rect y="34" width="420" height="20" fill="#131926" />
    <line x1="0" y1="54" x2="420" y2="54" stroke="#1e283c" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="24" cy="27" r="4.5" fill="#334155" />
    <circle cx="40" cy="27" r="4.5" fill="#334155" />
    <circle cx="56" cy="27" r="4.5" fill="#334155" />

    <!-- Active Contact Header -->
    <g transform="translate(84, 14)">
      <circle cx="13" cy="13" r="13" fill="#2563eb" />
      <text x="13" y="17" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" font-family="system-ui, sans-serif">A</text>
      <text x="34" y="14" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Alice</text>
      <text x="34" y="25" fill="#10b981" font-size="10" font-weight="600" font-family="system-ui, sans-serif">● Verified E2EE</text>
    </g>

    <!-- Lock Icon in Header Right -->
    <g transform="translate(376, 18)">
      <rect width="28" height="28" rx="6" fill="#1a2336" stroke="#25324c" stroke-width="1" />
      <path d="M14 8a3 3 0 0 0-3 3v2h6v-2a3 3 0 0 0-3-3z M9 13h10v7H9z" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" />
    </g>


    <!-- CHAT CONTENT PREVIEW -->

    <!-- Message 1 (Incoming) -->
    <g transform="translate(20, 78)">
      <rect width="270" height="48" rx="14" fill="#161e2e" stroke="#222d42" stroke-width="1" />
      <text x="14" y="22" fill="#e2e8f0" font-size="13" font-weight="500" font-family="system-ui, sans-serif">Are our messages stored locally?</text>
      <text x="14" y="38" fill="#64748b" font-size="10" font-weight="400" font-family="system-ui, sans-serif">10:42 AM</text>
    </g>

    <!-- Message 2 (Outgoing Primary Blue) -->
    <g transform="translate(110, 140)">
      <rect width="290" height="52" rx="14" fill="#2563eb" />
      <text x="14" y="22" fill="#ffffff" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Yes! Keys never leave your device.</text>
      <text x="14" y="38" fill="#93c5fd" font-size="11" font-weight="500" font-family="system-ui, sans-serif">Zero server tracking 🔒</text>
      <text x="248" y="38" fill="#dbeafe" font-size="10" font-weight="600" font-family="system-ui, sans-serif">10:43 ✓✓</text>
    </g>

    <!-- Call Connected Card (Minimal Startup Badge) -->
    <g transform="translate(20, 206)">
      <rect width="380" height="54" rx="14" fill="#091524" stroke="#192b45" stroke-width="1" />
      <!-- Shield Circle -->
      <circle cx="30" cy="27" r="14" fill="#10b981" />
      <path d="M25 27l3.5 3.5L35 24" fill="none" stroke="#042f2e" stroke-width="2" stroke-linecap="round" fill-opacity="0" />
      <text x="54" y="24" fill="#f8fafc" font-size="13" font-weight="700" font-family="system-ui, sans-serif">Real-time Audio / Video Call</text>
      <text x="54" y="39" fill="#34d399" font-size="11" font-weight="500" font-family="system-ui, sans-serif">P2P Encrypted • Trusted Contact</text>
      <text x="328" y="32" fill="#60a5fa" font-size="12" font-weight="600" font-family="system-ui, sans-serif">04:12</text>
    </g>

    <!-- Encrypted Media Attachment -->
    <g transform="translate(150, 274)">
      <rect width="250" height="46" rx="14" fill="#1a253a" stroke="#283956" stroke-width="1" />
      <rect x="12" y="11" width="24" height="24" rx="6" fill="#2563eb" />
      <path d="M20 18h8 M20 23h5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <text x="44" y="24" fill="#f1f5f9" font-size="12" font-weight="600" font-family="system-ui, sans-serif">vault_backup.enc</text>
      <text x="44" y="37" fill="#94a3b8" font-size="10" font-weight="500" font-family="system-ui, sans-serif">1.8 MB • Local Vault</text>
    </g>

    <!-- Minimal Chat Input -->
    <g transform="translate(20, 360)">
      <rect width="380" height="52" rx="26" fill="#070a11" stroke="#1b2436" stroke-width="1.5" />
      <text x="24" y="31" fill="#475569" font-size="13" font-weight="400" font-family="system-ui, sans-serif">Type an encrypted message...</text>
      
      <!-- Send Arrow Circle -->
      <circle cx="352" cy="26" r="16" fill="#2563eb" />
      <path d="M347 26h10 M352 21l5 5-5 5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

  </g>
</svg>