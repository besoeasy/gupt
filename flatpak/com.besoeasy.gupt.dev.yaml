app-id: com.besoeasy.gupt
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: gupt
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --filesystem=xdg-download

build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    npm_config_nodedir: /usr/lib/sdk/node22

modules:
  - name: gupt
    buildsystem: simple
    build-options:
      env:
        npm_config_offline: 'true'
        npm_config_cache: /run/build/gupt/flatpak-node/npm-cache
        electron_config_cache: /run/build/gupt/flatpak-node/cache/electron
    build-commands:
      - npm ci --offline --prefer-offline
      - test -f node_modules/electron/dist/electron
      - BUILD_TARGET=electron npm run electron:build:web
      - mkdir -p /app/lib/gupt
      - cp -r dist electron package.json /app/lib/gupt/
      - cp -r node_modules /app/lib/gupt/
      - install -Dm755 flatpak/gupt.sh /app/bin/gupt
      - install -Dm644 flatpak/com.besoeasy.gupt.desktop /app/share/applications/com.besoeasy.gupt.desktop
      - install -Dm644 flatpak/com.besoeasy.gupt.metainfo.xml /app/share/metainfo/com.besoeasy.gupt.metainfo.xml
      - for size in 16 24 32 48 64 128 256 512; do install -Dm644 build/icons/${size}x${size}.png /app/share/icons/hicolor/${size}x${size}/apps/com.besoeasy.gupt.png; done

    sources:
      - type: dir
        path: ../
        skip:
          - node_modules
          - dist
          - bundle
          - dev-dist
          - .flatpak-builder
          - build-dir
          - .git

      - generated-sources.json
